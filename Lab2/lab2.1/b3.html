<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3 - Tạo Table</title>
</head>
<body>
    <table border="1" bordercolor="blue" bgcolor="#f0f0f0" width="100%">
        <!-- Hàng 1: Gộp 3 cột giữa, tổng cộng 5 cột (1 + 3 + 1) -->
        <tr>
            <th><font color="red">Thứ tự</font></th>
            <th colspan="3" align="center"><font color="red">Tiêu đề chính</font></th>
            <th><font color="red">Ghi chú</font></th>
        </tr>
        <!-- Hàng 2: Gộp cả 5 cột -->
        <tr>
            <th colspan="5" align="center"><font color="blue">Danh sách chi tiết</font></th>
        </tr>
        <!-- Các hàng dữ liệu (Hàng 3 đến 6) -->
        <tr>
            <td align="center">1</td>
            <td>Nội dung 1.1</td>
            <td>Nội dung 1.2</td>
            <td>Nội dung 1.3</td>
            <td align="right">Đạt</td>
        </tr>
        <tr>
            <td align="center">2</td>
            <td>Nội dung 2.1</td>
            <td>Nội dung 2.2</td>
            <td>Nội dung 2.3</td>
            <td align="right">Đạt</td>
        </tr>
        <tr>
            <td align="center">3</td>
            <td>Nội dung 3.1</td>
            <td>Nội dung 3.2</td>
            <td>Nội dung 3.3</td>
            <td align="right">Chưa đạt</td>
        </tr>
        <tr>
            <td align="center">4</td>
            <td>Nội dung 4.1</td>
            <td>Nội dung 4.2</td>
            <td>Nội dung 4.3</td>
            <td align="right">Đạt</td>
        </tr>
    </table>
</body>
</html>
